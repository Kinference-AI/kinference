name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  RUSTUP_MAX_RETRIES: "10"

jobs:
  lint:
    runs-on: ubuntu-24.04
    # A cold cache compiles every dependency.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # The `zmq` crate compiles a bundled libzmq; protoc is vendored.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends g++
      # Installs what rust-toolchain.toml pins, components included.
      - run: rustup toolchain install
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3
      - uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: just lint

  # Installs both charts on kind against a CPU dummy-weights vLLM and checks
  # discovery, KV ingest and CRD status. The image build is cold here (the
  # BuildKit cache mounts don't persist), hence the wide timeout.
  test-smoke:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3
      - uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376
        with:
          install_only: true
      - run: just up
      - run: just test-smoke
      - name: Diagnostics
        if: failure()
        run: |
          kubectl get pods -A -o wide || true
          # Events and describe show e.g. a Pending pod's FailedScheduling.
          kubectl get events --sort-by=.lastTimestamp | tail -30 || true
          kubectl describe pods -l app.kubernetes.io/name=kinference || true
          kubectl describe pods -l mm/server-name=dummy-vllm || true
          kubectl get inferenceworkersets,inferencepools -A -o yaml || true
          kubectl logs deployment/kinference --tail=200 || true
          kubectl logs deployment/dummy-vllm --tail=200 || true
          kind export logs /tmp/kind-logs --name kinference-smoke || true
      - name: Upload kind logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: kind-logs-${{ matrix.os }}
          path: /tmp/kind-logs
          retention-days: 3

  test-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends g++
      - run: rustup toolchain install
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3
      - uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: just test-unit

  test-ai-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: .github/ai-review
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3
      - run: just test-ai-review

  ready-for-merge:
    name: Ready for merge
    needs:
      - lint
      - test-smoke
      - test-unit
      - test-ai-review
    runs-on: ubuntu-24.04
    steps:
      - name: Ready for merge
        run: echo Ready for merge
