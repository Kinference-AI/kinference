# More than one replica multiplies ZMQ ingest traffic and splits in-flight
# tracking (less precise waits); every replica still sees every KV event.
#
# To scale past one replica:
#  1. Set `config.leader_election.enabled=true`; one replica writes CRD status.
#  2. Set strategyType=RollingUpdate.
#  3. Add a PodDisruptionBudget with minAvailable: 1.
#
# Every call for one request (PushBody, Pick, PullBody, the reports) must
# reach the same replica: stream_id and response_id are process-local.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kinference.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kinference.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: {{ .Values.strategyType }}
  selector:
    matchLabels:
      {{- include "kinference.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kinference.selectorLabels" . | nindent 8 }}
      annotations:
        # The config is read once at startup.
        checksum/config: {{ include "kinference.config" . | sha256sum }}
    spec:
      serviceAccountName: {{ include "kinference.fullname" . }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: kinference
          image: {{ include "kinference.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--config", "/etc/kinference/config.json"]
          env:
            # The default pins dynamo_kv_router::indexer::radix_tree to error:
            # its `block_hash mismatch` warning is harmless (the tree keys on
            # tokens_hash, computed by kinference) but fires several times a
            # second. A broken chain shows on the dashboard's prefix cache row
            # instead. `Block not published. Block size must be N` comes from
            # another module and stays visible: set kvBlockSize to the engine's.
            - name: RUST_LOG
              value: {{ .Values.logLevel | quote }}
            - name: KINFERENCE_LOG_FORMAT
              value: {{ .Values.logFormat | quote }}
            {{- if .Values.enableReplay }}
            # Checked for presence, not value, so it is omitted when disabled.
            - name: KINFERENCE_ENABLE_REPLAY
              value: "1"
            {{- end }}
            # The leader Lease's holderIdentity.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- if .Values.hfTokenSecret }}
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.hfTokenSecret }}
                  key: HUGGING_FACE_HUB_TOKEN
            {{- end }}
          ports:
            - name: admin
              containerPort: {{ .Values.service.adminPort }}
              protocol: TCP
            - name: grpc
              containerPort: {{ .Values.service.grpcPort }}
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/kinference
              readOnly: true
            {{- if or .Values.tokenizers.existingClaim .Values.tokenizers.configMap }}
            - name: tokenizers
              mountPath: /etc/tokenizers
              readOnly: true
            {{- end }}
          # Readiness waits for enabled watches to initialize, not for workers.
          readinessProbe:
            httpGet:
              path: /readyz
              port: admin
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 3
          # Catches hard hangs only.
          livenessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "kinference.fullname" . }}-config
        {{- if .Values.tokenizers.existingClaim }}
        - name: tokenizers
          persistentVolumeClaim:
            claimName: {{ .Values.tokenizers.existingClaim }}
        {{- else if .Values.tokenizers.configMap }}
        - name: tokenizers
          configMap:
            name: {{ .Values.tokenizers.configMap }}
        {{- end }}
