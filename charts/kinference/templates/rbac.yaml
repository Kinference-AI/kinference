{{- if .Values.rbac.create }}
# Cluster-wide so discovery can watch EndpointSlices in every namespace.
# Everything per-pod that routing needs is on the EndpointSlice.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kinference.fullname" . }}-endpointslice-watcher
  labels:
    {{- include "kinference.labels" . | nindent 4 }}
rules:
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  # Worker sets drive discovery even with policy off; writing their status
  # is policy-gated below.
  - apiGroups: ["kinference.buoyant.io"]
    resources: ["inferenceworkersets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kinference.fullname" . }}-endpointslice-watcher
  labels:
    {{- include "kinference.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kinference.fullname" . }}-endpointslice-watcher
subjects:
  - kind: ServiceAccount
    name: {{ include "kinference.fullname" . }}
    namespace: {{ .Release.Namespace }}
{{- $leaseNamespace := dig "leader_election" "namespace" "" (.Values.config | default dict) | default .Release.Namespace }}
---
# Leader election, in the Lease's namespace only. `update` because the
# elector replaces with the last-seen resourceVersion. Without these verbs
# no replica leads and no status is written, so gateways never program
# routes.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kinference.fullname" . }}-leader-election
  namespace: {{ $leaseNamespace }}
  labels:
    {{- include "kinference.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kinference.fullname" . }}-leader-election
  namespace: {{ $leaseNamespace }}
  labels:
    {{- include "kinference.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kinference.fullname" . }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ include "kinference.fullname" . }}
    namespace: {{ .Release.Namespace }}
{{- if include "kinference.policyEnabled" . }}
---
# Policy-only permissions. HTTPRoutes are read because InferencePool
# `status.parents[]` is keyed by parent Gateway; Services for the port a
# BackendBinding carries.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kinference.fullname" . }}-inference-policy
  labels:
    {{- include "kinference.labels" . | nindent 4 }}
rules:
  - apiGroups: ["kinference.buoyant.io"]
    resources: ["inferencepools", "inferencepolicies", "inferenceproviders"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["kinference.buoyant.io"]
    resources:
      - "inferencepools/status"
      - "inferencepolicies/status"
      - "inferenceworkersets/status"
      - "inferenceproviders/status"
    verbs: ["get", "update", "patch"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes"]
    verbs: ["get", "list", "watch"]
  # The only objects kinference writes (`config.policy.backend_bindings`).
  - apiGroups: ["gateway.linkerd.io"]
    resources: ["backendbindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Gates cross-namespace destinations and provider backendRefs.
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["referencegrants"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch"]
  # No `secrets` or `gatewaybackends`, on purpose: the caller resolves a
  # provider's GatewayBackend, so kinference never holds a vendor credential.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kinference.fullname" . }}-inference-policy
  labels:
    {{- include "kinference.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kinference.fullname" . }}-inference-policy
subjects:
  - kind: ServiceAccount
    name: {{ include "kinference.fullname" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
