# Default values for the kinference chart.

replicaCount: 1

# Recreate keeps two replicas from overlapping. See templates/deployment.yaml
# before scaling past one.
strategyType: Recreate

image:
  repository: cr.kinference.ai/kinference-ai/kinference
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

nodeSelector: {}

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 2000m
    memory: 2Gi

# RUST_LOG; see templates/deployment.yaml for the radix_tree pin.
logLevel: "kinference=info,dynamo_kv_router::indexer::radix_tree=error,dynamo_kv_router=warn"

# KINFERENCE_LOG_FORMAT: text, or json for one object per line.
logFormat: text

# Request missed KV-event history on attach (KINFERENCE_ENABLE_REPLAY).
# Contends with tokenize HTTP and can adopt blocks the engine has evicted.
enableReplay: false

# Secret with a HUGGING_FACE_HUB_TOKEN key, for gated models.
hfTokenSecret: ""

# Tokenizer files mounted at /etc/tokenizers/{model}/tokenizer.json, so
# local tokenize needs no Hub egress. Set at most one.
tokenizers:
  existingClaim: ""
  configMap: ""

service:
  type: ClusterIP
  grpcPort: 50051
  adminPort: 9001

rbac:
  create: true

# Requires the Prometheus Operator CRDs.
podMonitor:
  enabled: false

# For the kube-prometheus-stack Grafana sidecar.
grafanaDashboard:
  enabled: false

# The gateway Extension (needs the gateway's CRDs). `name` is the release
# namespace Extension every BackendBinding references, whether or not the
# chart creates it. With `enabled: false`, name your own Extension that
# admits the pools' namespaces, or "" for routes with their own
# extensionRef filter.
extension:
  enabled: false
  name: chat-picker
  # Request header carrying the tenant id.
  tenantHeader: ""
  # Interactive (default) | Batch | Deferrable.
  qos: ""

# The kinference config (src/config.rs), rendered to JSON. The chart sets
# listen, admin_listen and policy.backend_binding_extension{,_namespace}.
# When absent it sets policy.namespace and kubernetes.namespace to the
# release namespace ("" means all) and tokenize.local.mount_dir when
# `tokenizers` mounts something.
config:
  metrics_poll_ms: 1000
  models_refresh_secs: 30
  # Raise above the worst-case non-streaming response time.
  # observation_ttl_secs: 600

  # Body buffer defaults. Keep the total under the memory limit; raise both
  # together if kinference_body_rejected_total climbs.
  # body_max_total_kb: 262144         # 256 MiB server-wide (KB = 1024 bytes)
  # body_max_request_kb: 8192         # 8 MiB per request
  # body_ttl_secs: 60                 # backstop release (Abort only shortens it)
  # body_idle_timeout_secs: 30        # max silence between PushBody chunks

  # tenant_labels: all is unbounded (about 91 series per model, qos and
  # tenant). Bound it with a list such as [acme, globex]; others go under
  # tenant="default". "none" or omitting the section drops the label.
  metrics:
    tenant_labels: all

  # The tokenization mode is per profile (profiles.<name>.tokenize).
  tokenize:
    local:
      warmup: true

  # Named bundles of routing tuning that worker sets reference by name.
  profiles:
    default:
      # Starting points; refit from this profile's observation events. The
      # router logs one event per streaming request at debug level, under the
      # kinference::observation target. To log the events, set logFormat to
      # json and add kinference::observation=debug to logLevel. Each event
      # names its profile. docs/local-development.md shows how to extract
      # the events.
      predictor:
        base_ms: 400.0
        queue_ms_per_entry: 0.2
        attention_uncached_block_ms: 2.3
        attention_uncached_per_every_block_ms: 0.03
        cache_pressure_penalty_ms: 0.0
        q_running_penalty_peak_ms: 0
        forward_pass_ms: 5
        # A KV eviction rate; tracks GPU SKU and TP degree.
        expected_overlap_alpha: 1.0
      picker:
        top_k_min: 1
        top_k_fraction: 0.0
        inflight_tracking: true
        replication_threshold_pct: 10
        replication_warm_target: 2
        tie_tolerance_ms: 0
      # "render" asks the engine's /v1/chat/completions/render for exact token
      # IDs; move to "compare" then "local" once parity is confirmed.
      tokenize:
        mode: render

  # EndpointSlice-discovered worker sets, in addition to the ones
  # `kubernetes` derives from InferenceWorkerSet CRs. None by default.
  workersets: {}

  policy:
    enabled: true
    # One BackendBinding per InferencePool, so a gateway can resolve routes
    # to pools. Needs the gateway's BackendBinding CRD.
    backend_bindings: true
    # All namespaces, which keeps every Service in memory; on big clusters
    # name one instead.
    namespace: ""

  kubernetes:
    enabled: true
    # Match `policy.namespace`.
    namespace: ""
    discovery_defaults:
      # Used only when neither the Pod nor the CR names a port.
      http_port: 8000
      zmq_port: 5557
      replay_port: 5558
