apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: inferencepolicies.kinference.buoyant.io
spec:
  group: kinference.buoyant.io
  names:
    kind: InferencePolicy
    listKind: InferencePolicyList
    plural: inferencepolicies
    singular: inferencepolicy
    shortNames: [infpol, infpols]
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    additionalPrinterColumns:
    - {name: State, type: string, jsonPath: ".status.state"}
    - {name: Age, type: date, jsonPath: ".metadata.creationTimestamp"}
    schema:
      openAPIV3Schema:
        description: |-
          The policy determining which destination in an InferencePool is
          selected for a given request. The first rule to match wins.
        type: object
        properties:
          apiVersion: {type: string}
          kind: {type: string}
          metadata: {type: object}
          spec:
            type: object
            properties:
              unmatched:
                type: string
                enum: [ServeLocal, Reject]
                default: ServeLocal
              rules:
                type: array
                maxItems: 32
                x-kubernetes-list-type: atomic
                items:
                  type: object
                  required: [name, route]
                  properties:
                    name: {type: string, maxLength: 253}
                    matches:
                      description: |-
                        Defines which requests this rule will apply to.  Fields
                        within one entry are ANDed; entries are ORed. Note that
                        a rule with no matches will match everything and must be
                        placed last.
                      type: array
                      maxItems: 16
                      x-kubernetes-list-type: atomic
                      items:
                        description: |-
                          Request predicates. Scalar is exact match; array is
                          membership; hash is an explicit operator.
                        type: object
                        properties:
                          model:         {x-kubernetes-preserve-unknown-fields: true}
                          inputTokens:   {x-kubernetes-preserve-unknown-fields: true}
                          maxTokens:     {x-kubernetes-preserve-unknown-fields: true}
                          tenant:        {x-kubernetes-preserve-unknown-fields: true}
                          qos:
                            description: |-
                              One of interactive | batch | deferrable. Always an
                              array. Default is interactive.
                            type: array
                            minItems: 1
                            maxItems: 3
                            x-kubernetes-list-type: set
                            items: {type: string, enum: [interactive, batch, deferrable]}
                          tag:
                            description: |-
                              A set of opaque string tags attached to the request.

                              Set semantics. A scalar RHS means contains (`tag:
                              gpu`); an array means intersects (`tag: [gpu,
                              restricted]`); `{containsAll: [...]}` means all of
                              them; `{not: gpu}` means the tag is absent.

                              Nothing sets tags on requests yet: the router sends
                              an empty set, so a scalar, array or `containsAll`
                              never matches and `{not: ...}` always matches.
                            x-kubernetes-preserve-unknown-fields: true
                    route:
                      type: object
                      required: [select]
                      properties:
                        consider:
                          description: |-
                            The full set of endpoints to consider. Leave blank
                            to simply use all known endpoints that provide the
                            model named in the request (including via aliases).

                            This field can be used to add models not named in
                            the request, including as a weighted choice.

                            An empty list is rejected rather than treated as the
                            default.
                          type: array
                          minItems: 1
                          maxItems: 16
                          x-kubernetes-list-type: atomic
                          items:
                            type: object
                            properties:
                              name: {type: string, maxLength: 253}
                              type:
                                description: |-
                                  Shorthand for backends.type.
                                type: string
                                enum: [Local, Provider]
                              weight:
                                description: |-
                                  Relative weights (not percentages).
                                type: integer
                                minimum: 1
                                maximum: 1000000
                              models:
                                type: object
                                properties:
                                  fromRequest: {type: boolean}
                                  names: {type: array, maxItems: 32, items: {type: string, maxLength: 512}}
                                x-kubernetes-validations:
                                - rule: "has(self.fromRequest) != has(self.names)"
                                  message: "exactly one of fromRequest or names"
                              backends:
                                description: Selector over the pool's destinations.
                                type: object
                                properties:
                                  type: {type: string, enum: [Local, Provider]}
                                  names: {type: array, maxItems: 32, items: {type: string, maxLength: 253}}
                                  selector:
                                    type: object
                                    properties:
                                      matchLabels:
                                        type: object
                                        maxProperties: 64
                                        additionalProperties: {type: string}
                            x-kubernetes-validations:
                            - rule: "!has(self.type) || !has(self.backends)"
                              message: "type is shorthand for backends.type; do not set both"
                        exclude:
                          description: |-
                            Endpoints to exclude from consideration.
                            Order-independent. Two exclusions express OR, one
                            exclusion with two fields expresses AND.
                          type: array
                          maxItems: 16
                          x-kubernetes-list-type: atomic
                          items:
                            type: object
                            required: [name, drop]
                            properties:
                              name: {type: string, maxLength: 253}
                              if:
                                description: |-
                                  Request parameters to which this exclusion
                                  applies. A single clause, ANDed. The router
                                  evaluates it for each candidate, with
                                  inputTokens as that candidate's own count. A
                                  candidate with no count, such as a provider,
                                  misses an inputTokens term.
                                type: object
                                properties:
                                  model:         {x-kubernetes-preserve-unknown-fields: true}
                                  inputTokens:   {x-kubernetes-preserve-unknown-fields: true}
                                  maxTokens:     {x-kubernetes-preserve-unknown-fields: true}
                                  tenant:        {x-kubernetes-preserve-unknown-fields: true}
                                  qos:
                                    description: |-
                                      One of interactive | batch | deferrable. Always an
                                      array. Default is interactive.
                                    type: array
                                    minItems: 1
                                    maxItems: 3
                                    x-kubernetes-list-type: set
                                    items: {type: string, enum: [interactive, batch, deferrable]}
                                  tag:
                                    description: |-
                                      A set of opaque string tags attached to the request.

                                      Set semantics. A scalar RHS means contains (`tag:
                                      gpu`); an array means intersects (`tag: [gpu,
                                      restricted]`); `{containsAll: [...]}` means all of
                                      them; `{not: gpu}` means the tag is absent.

                                      Nothing sets tags on requests yet: the router sends
                                      an empty set, so a scalar, array or `containsAll`
                                      never matches and `{not: ...}` always matches.
                                    x-kubernetes-preserve-unknown-fields: true
                              drop:
                                type: object
                                properties:
                                  contextWindow:       {x-kubernetes-preserve-unknown-fields: true}
                                  predictedTTFT:       {x-kubernetes-preserve-unknown-fields: true}
                                  prefixCacheHitRatio: {x-kubernetes-preserve-unknown-fields: true}
                                  queuedPrompts:       {x-kubernetes-preserve-unknown-fields: true}
                                  kvCacheUsage:        {x-kubernetes-preserve-unknown-fields: true}
                                  model:
                                    type: object
                                    properties:
                                      name: {x-kubernetes-preserve-unknown-fields: true}
                                  backend:
                                    type: object
                                    properties:
                                      type:            {x-kubernetes-preserve-unknown-fields: true}
                                      name:            {x-kubernetes-preserve-unknown-fields: true}
                                      readyEndpoints:  {x-kubernetes-preserve-unknown-fields: true}
                                      observedTTFTP95: {x-kubernetes-preserve-unknown-fields: true}
                                      budgetExhausted: {x-kubernetes-preserve-unknown-fields: true}
                        select:
                          description: |-
                            Which endpoint to choose, after consideration and
                            exclusion. This is in ordered tiers; the first with
                            a surviving candidate wins outright.  If an
                            objective is specified, it must defined for every
                            candidate in its tier. For example, PredictedTTFT is
                            Local-only, so a tier spanning both Local and
                            Provider types cannot use it.
                          type: array
                          minItems: 1
                          maxItems: 8
                          x-kubernetes-list-type: atomic
                          items:
                            type: object
                            properties:
                              type:
                                description: Shorthand for backends.type.
                                type: string
                                enum: [Local, Provider]
                              backends:
                                type: object
                                properties:
                                  type: {type: string, enum: [Local, Provider]}
                                  names: {type: array, maxItems: 32, items: {type: string, maxLength: 253}}
                                  selector:
                                    type: object
                                    properties:
                                      matchLabels:
                                        type: object
                                        maxProperties: 64
                                        additionalProperties: {type: string}
                              minimize:
                                type: string
                                enum: [PredictedTTFT, EstimatedTTFT]
                              order:
                                type: array
                                maxItems: 16
                                items: {type: string, maxLength: 253}
                            x-kubernetes-validations:
                            - rule: "has(self.minimize) != has(self.order)"
                              message: "a tier ranks by exactly one of minimize or order"
                            - rule: "!has(self.type) || !has(self.backends)"
                              message: "type is shorthand for backends.type; do not set both"
                        tieBreak:
                          type: array
                          maxItems: 4
                          items: {type: string, enum: [PreferLocal, Random]}
                        onEmpty:
                          type: string
                          enum: [Reject, FallThrough]
                          default: Reject
                  x-kubernetes-validations:
                  - rule: "!has(self.route.select) || self.route.select.all(t, !has(t.minimize) || t.minimize != 'PredictedTTFT' || has(t.type) && t.type == 'Local' || has(t.backends) && has(t.backends.type) && t.backends.type == 'Local' || has(self.route.consider) && self.route.consider.all(c, has(c.type) && c.type == 'Local' || has(c.backends) && has(c.backends.type) && c.backends.type == 'Local'))"
                    message: "PredictedTTFT is Local-only: constrain the tier or the candidate set to Local, or use EstimatedTTFT"
          status:
            type: object
            properties:
              state:
                type: string
                maxLength: 128
              referencedBy:
                type: array
                maxItems: 64
                x-kubernetes-list-type: atomic
                items: {type: string, maxLength: 253}
              warnings:
                type: array
                maxItems: 32
                items: {type: string, maxLength: 2048}
              conditions:
                type: array
                maxItems: 8
                x-kubernetes-list-type: map
                x-kubernetes-list-map-keys: [type]
                items:
                  type: object
                  required: [type, status, lastTransitionTime, reason, message]
                  properties:
                    type: {type: string, maxLength: 316}
                    status: {type: string, enum: ["True", "False", "Unknown"]}
                    observedGeneration: {type: integer, format: int64, minimum: 0}
                    lastTransitionTime: {type: string, format: date-time}
                    reason: {type: string, maxLength: 1024}
                    message: {type: string, maxLength: 32768}
    subresources:
      status: {}
