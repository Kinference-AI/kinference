apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: inferenceproviders.kinference.buoyant.io
spec:
  group: kinference.buoyant.io
  names:
    kind: InferenceProvider
    listKind: InferenceProviderList
    plural: inferenceproviders
    singular: inferenceprovider
    shortNames: [infprov, infprovs]
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    additionalPrinterColumns:
    - {name: Backend, type: string, jsonPath: ".spec.backendRef.name"}
    - {name: API, type: string, jsonPath: ".spec.api"}
    - {name: Path, type: string, jsonPath: ".spec.path", priority: 1}
    - {name: State, type: string, jsonPath: ".status.state"}
    - {name: Age, type: date, jsonPath: ".metadata.creationTimestamp"}
    schema:
      openAPIV3Schema:
        description: |-
          An inference provider, potentially off-cluster or remote.
        type: object
        properties:
          apiVersion: {type: string}
          kind: {type: string}
          metadata: {type: object}
          spec:
            type: object
            required: [backendRef, api, models]
            properties:
              backendRef:
                description: |-
                  A gateway.linkerd.io/GatewayBackend corresponding to the
                  remote destination.
                type: object
                required: [name]
                properties:
                  group: {type: string, default: gateway.linkerd.io, maxLength: 253}
                  kind: {type: string, default: GatewayBackend, maxLength: 253}
                  name: {type: string, maxLength: 253}
                  namespace: {type: string, maxLength: 253}
              api:
                description: |-
                  Wire format that the provider speaks. The only
                  currently-supported value is `OpenAI`.
                type: string
                enum: [OpenAI]
              path:
                description: |-
                  Path to dispatch on, replacing the one the client sent.
                  Optional; omit it whenever this provider serves the same path
                  the clients already use.
                  Must start with `/`, and may carry a query string, which
                  replaces the client's. It is joined AFTER any path prefix in
                  the GatewayBackend's `baseURL`.
                type: string
                maxLength: 1024
                pattern: "^/"
              models:
                description: |-
                  All models this provider serves. Required.
                type: array
                minItems: 1
                maxItems: 64
                x-kubernetes-list-type: atomic
                items:
                  type: object
                  required: [name]
                  properties:
                    name:
                      description: |-
                        Canonical name for the model.
                      type: string
                      maxLength: 512
                    aliases:
                      description: |-
                        Any client-facing names that should also resolve to `name`.
                      type: array
                      maxItems: 32
                      x-kubernetes-list-type: atomic
                      items: {type: string, maxLength: 512}
                    contextWindow:
                      description: |-
                        The model's context window, in tokens. The router
                        does not check requests against it. A policy can
                        still drop candidates by it in an exclusion.
                      type: integer
                      minimum: 1
          status:
            type: object
            properties:
              state:
                type: string
                maxLength: 256
              conditions:
                type: array
                maxItems: 8
                x-kubernetes-list-type: map
                x-kubernetes-list-map-keys: [type]
                items:
                  type: object
                  required: [type, status, lastTransitionTime, reason, message]
                  properties:
                    type: {type: string, maxLength: 316}
                    status: {type: string, enum: ["True", "False", "Unknown"]}
                    observedGeneration: {type: integer, format: int64, minimum: 0}
                    lastTransitionTime: {type: string, format: date-time}
                    reason: {type: string, maxLength: 1024}
                    message: {type: string, maxLength: 32768}
    subresources:
      status: {}
