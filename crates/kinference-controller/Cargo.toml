[package]
name = "kinference-controller"
description = "The Kubernetes control plane: the CRD watch, the status and binding writers, the worker-set reconcile, leader election and EndpointSlice discovery"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
kinference-policy.workspace = true
kinference-fleet.workspace = true
kube = { workspace = true, features = ["client", "runtime", "rustls-tls"] }
k8s-openapi.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tokio-util.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
prometheus.workspace = true
chrono.workspace = true
getrandom.workspace = true

[dev-dependencies]
json-patch = "4"
kinference-policy = { workspace = true, features = ["test-util"] }
tracing-subscriber = "0.3"

[lints]
workspace = true
