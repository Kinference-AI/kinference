[package]
name = "kinference-router"
description = "The request path: the service, scoring, the picker, the body store, the tokenizer, observations and gRPC"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
kinference-policy.workspace = true
kinference-fleet.workspace = true
dynamo-kv-router.workspace = true
tonic.workspace = true
prost = "0.13"
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tokio-util.workspace = true
tokio-stream = "0.1"
futures.workspace = true
serde.workspace = true
# `preserve_order`, so a rewritten body keeps the client's key order. vLLM's
# guided decoding emits a JSON schema's properties in that order.
serde_json = { workspace = true, features = ["preserve_order"] }
tracing.workspace = true
reqwest = { workspace = true, features = ["json", "rustls-tls"] }
dashmap.workspace = true
prometheus.workspace = true
# `http` for the Hub fetch; `onig` is the regex pre-tokenizer most models
# need. Default features pull python-binding scaffolding.
tokenizers = { version = "0.23", default-features = false, features = ["http", "onig"] }
# `loop_controls` for `{% break %}` (Mistral, Hermes); `json` for `tojson`
# (Llama 3.2 vision).
minijinja = { version = "2.20", features = ["loop_controls", "json"] }
# `pycompat` for Python dict methods such as `.get` (Gemma 3/4).
minijinja-contrib = { version = "2.20", features = ["pycompat"] }
# `strftime_now`, which Llama 3.1+ templates call.
chrono.workspace = true
getrandom.workspace = true

[dev-dependencies]
kinference-policy = { workspace = true, features = ["test-util"] }
kinference-fleet = { workspace = true, features = ["test-util"] }
# `net` and axum for the fake `/render` server.
tokio = { workspace = true, features = ["net"] }
axum.workspace = true
tempfile.workspace = true
# `json`, so the observation test parses the event as a log pipeline would.
tracing-subscriber = { version = "0.3", features = ["json"] }

[build-dependencies]
tonic-build = "0.12"
# Bundled `protoc`, so no system protobuf compiler is needed.
protoc-bin-vendored = "3"

[lints]
workspace = true
