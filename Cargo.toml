[workspace]
members = [
    ".",
    "crates/kinference-policy",
    "crates/kinference-fleet",
    "crates/kinference-router",
    "crates/kinference-controller",
    "crates/kinfctl",
]
default-members = [
    ".",
    "crates/kinference-policy",
    "crates/kinference-fleet",
    "crates/kinference-router",
    "crates/kinference-controller",
    "crates/kinfctl",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
# kube 5.1's MSRV.
rust-version = "1.95"
license = "Apache-2.0"

[workspace.dependencies]
kinference-policy = { path = "crates/kinference-policy" }
kinference-fleet = { path = "crates/kinference-fleet" }
kinference-router = { path = "crates/kinference-router" }
kinference-controller = { path = "crates/kinference-controller" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
clap = { version = "4", features = ["derive"] }
kube = { version = "5", default-features = false }
k8s-openapi = { version = "0.29", features = ["latest"] }
getrandom = "0.4"
dynamo-kv-router = { version = "1.7", default-features = false }
tokio = "1"
tokio-util = "0.7"
zmq = "0.10"
reqwest = { version = "0.13", default-features = false }
dashmap = "6"
prometheus-parse = "0.2"
prometheus = { version = "0.14", default-features = false }
tonic = "0.14"
futures = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
axum = "0.8"
tempfile = "3"
# Same major version as kube-client's, so it adds no crate to the build.
serde-saphyr = "2"
tracing-subscriber = "0.3"

[workspace.lints.clippy]
# Service functions return `tonic::Status`, which is large, by contract.
result_large_err = "allow"
mod_module_files = "warn"

[package]
name = "kinference"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
kinference-policy.workspace = true
kinference-fleet.workspace = true
kinference-router.workspace = true
kinference-controller.workspace = true
dynamo-kv-router.workspace = true
tonic.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util.workspace = true
serde.workspace = true
zmq.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }
anyhow = "1"
clap.workspace = true
serde_json.workspace = true
prometheus.workspace = true
axum.workspace = true
# `main` installs the process's rustls crypto provider. The dependency graph
# enables both aws-lc-rs (reqwest) and ring (ureq), so rustls can't pick one.
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }

[lints]
workspace = true

[dev-dependencies]
kinference-policy = { workspace = true, features = ["test-util"] }
kinference-fleet = { workspace = true, features = ["test-util"] }
k8s-openapi.workspace = true
# `ServiceExt::oneshot`, to drive the admin router in tests.
tower = { version = "0.5", features = ["util"] }
tempfile.workspace = true
